<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5a2d82"><title>فاحص شبكة الواي فاي</title><link rel="stylesheet" href="./style.css"><link rel="manifest" href="./manifest.json"></head><body><header><h1>فاحص شبكة الواي فاي</h1><p>تسجيل بيانات الشبكة والأجهزة المصرح لك بفحصها</p></header><main><section><h2>بيانات الراوتر</h2><label>اسم الشبكة<input id="ssid"></label><label>عنوان الراوتر<input id="routerIp" placeholder="192.168.1.1"></label><label>الشركة أو الموديل<input id="model"></label><button id="saveRouter">حفظ بيانات الراوتر</button><button id="openRouter">فتح صفحة الراوتر</button></section><section><h2>تسجيل فحص</h2><label>عدد الأجهزة الظاهرة<input id="count" type="number" min="0"></label><label>ملاحظات<textarea id="scanNotes"></textarea></label><button id="saveScan">حفظ نتيجة الفحص</button></section><section><h2>إضافة جهاز يدويًا</h2><label>اسم الجهاز<input id="name"></label><label>النوع<input id="type"></label><label>عنوان IP<input id="ip"></label><label>عنوان MAC<input id="mac"></label><label>ملاحظات<input id="notes"></label><button id="add">إضافة الجهاز</button></section><section><h2>الأجهزة المسجلة</h2><div id="devices">لا توجد أجهزة.</div></section><section><h2>سجل الفحوصات</h2><div id="scans">لا توجد فحوصات.</div></section><section><h2>التقارير</h2><button id="csv">تنزيل CSV</button><button id="backup">نسخة احتياطية JSON</button><p>الحفظ محلي على هذا الجهاز. لا توجد مزامنة سحابية.</p></section></main><script src="./app.js"></script><script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));</script></body></html>
